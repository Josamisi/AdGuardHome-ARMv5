
name: Build AdGuard Home ARMv5

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest stable version
        id: version
        run: |
          RELEASE=$(curl -fsSL \
            https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest)

          VERSION=$(echo "$RELEASE" | jq -r '.tag_name')
          URL=$(echo "$RELEASE" | jq -r \
            '.assets[] | select(.name == "AdGuardHome_linux_armv5.tar.gz") | .browser_download_url')

          test -n "$VERSION"
          test -n "$URL"
          test "$URL" != "null"

          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download official ARMv5 binary
        run: |
          mkdir -p dist
          curl -fL --retry 3 \
            "${{ steps.version.outputs.url }}" \
            -o /tmp/adguardhome.tar.gz

          tar -xzf /tmp/adguardhome.tar.gz -C /tmp

          find /tmp/AdGuardHome -type f -name AdGuardHome \
            -exec cp {} dist/AdGuardHome \;

          test -s dist/AdGuardHome
          cp /etc/ssl/certs/ca-certificates.crt dist/ca-certificates.crt

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/adguardhome-armv5"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v5
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
