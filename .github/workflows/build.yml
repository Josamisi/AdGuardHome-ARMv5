
name: Build AdGuard Home ARMv5

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      url: ${{ steps.version.outputs.url }}
      build: ${{ steps.check.outputs.build }}

    steps:
      - name: Get latest stable version
        id: version
        run: |
          RELEASE=$(curl -fsSL \
            https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest)

          VERSION=$(echo "$RELEASE" | jq -r '.tag_name')
          URL=$(echo "$RELEASE" | jq -r \
            '.assets[] | select(.name == "AdGuardHome_linux_armv5.tar.gz") | .browser_download_url')

          test -n "$VERSION"
          test -n "$URL"
          test "$VERSION" != "null"
          test "$URL" != "null"

          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists in GHCR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/adguardhome-armv5"

          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already published. No build needed."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "New version $VERSION detected. Build required."
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official ARMv5 binary
        env:
          URL: ${{ needs.check-version.outputs.url }}
        run: |
          mkdir -p dist

          curl -fL --retry 3 \
            "$URL" \
            -o /tmp/adguardhome.tar.gz

          tar -xzf /tmp/adguardhome.tar.gz -C /tmp

          find /tmp/AdGuardHome -type f -name AdGuardHome \
            -exec cp {} dist/AdGuardHome \;

          test -s dist/AdGuardHome

          cp /etc/ssl/certs/ca-certificates.crt \
            dist/ca-certificates.crt

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/adguardhome-armv5"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v5
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.check-version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check-version.outputs.version }}
