
name: Build AdGuard Home ARMv5

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest stable AdGuard Home version
        id: version
        run: |
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest \
            | jq -r '.tag_name')
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "AdGuard Home version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/adguardhome-armv5"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"      

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v5
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
